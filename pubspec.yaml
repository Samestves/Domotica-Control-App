name: control_domotica
description: "App para controlar la maqueta domótica y el carro robot por Bluetooth o Wi-Fi."
publish_to: 'none'

# version: nombre+número de compilación. Mantener igual a lib/version.dart.
version: 0.6.0+6

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.15
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter (licencia OFL, ver assets/fonts/OFL-Inter.txt): la letra libre más cercana a la de Apple.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Variante para títulos grandes: más ajustada, como los títulos de iOS.
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
