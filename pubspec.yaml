name: control_domotica
description: "App para controlar la maqueta domótica y el carro robot por Bluetooth o Wi-Fi."
publish_to: 'none'

# version: nombre+nÃºmero de compilaciÃ³n. Mantener igual a lib/version.dart.
version: 0.9.6+26

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.15
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # D-DIN (licencia OFL, ver assets/fonts/OFL-D-DIN.txt): la familia DIN que usa SpaceX en Starlink.
  fonts:
    - family: DDIN
      fonts:
        - asset: assets/fonts/D-DIN.otf
          weight: 400
        - asset: assets/fonts/D-DIN-Bold.otf
          weight: 700
    # Iconos Phosphor (licencia MIT, ver assets/fonts/LICENSE-Phosphor.txt): lÃ­nea fina y rellenos.
    - family: PhosphorLight
      fonts:
        - asset: assets/fonts/Phosphor-Light.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
